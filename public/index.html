<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Media Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #35152b, transparent 35%),
        radial-gradient(circle at bottom right, #102b3d, transparent 35%),
        #08090d;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .logo {
      text-align: center;
      margin: 30px 0;
    }

    .logo h1 {
      font-size: 32px;
      background: linear-gradient(90deg, #ff0050, #00f2ea);
      -webkit-background-clip: text;
      color: transparent;
    }

    .logo p {
      color: #999;
      margin-top: 8px;
    }

    .card {
      background: rgba(20, 21, 28, .94);
      border: 1px solid #30313b;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
      font-size: 14px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: #0c0d12;
      border: 1px solid #383944;
      border-radius: 12px;
      padding: 15px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #00f2ea;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:active {
      transform: scale(.97);
    }

    .paste {
      background: #292b35;
    }

    .download {
      width: 100%;
      background: linear-gradient(90deg, #ff0050, #00b8ff);
      margin-top: 5px;
      font-size: 16px;
    }

    .download:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 20px;
      border-top: 1px solid #30313b;
      padding-top: 20px;
    }

    .thumb {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 15px;
      background: #111;
      margin-bottom: 15px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .author {
      color: #999;
      margin-bottom: 15px;
    }

    .quality {
      width: 100%;
      background: #0c0d12;
      color: white;
      border: 1px solid #383944;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-top: 15px;
      background: #24151a;
      color: #ff8da8;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #aaa;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #333;
      border-top-color: #00f2ea;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: auto auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      text-align: center;
      color: #666;
      margin-top: 25px;
      font-size: 13px;
    }

    @media(max-width:500px) {
      .input-box {
        flex-direction: column;
      }

      .paste {
        width: 100%;
      }

      .logo h1 {
        font-size: 27px;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      <h1>🎵 TikTok Downloader</h1>
      <p>Download media from supported TikTok URLs</p>
    </div>

    <div class="card">

      <label for="url">TikTok Video URL</label>

      <div class="input-box">
        <input
          id="url"
          type="url"
          placeholder="Paste TikTok URL here..."
          autocomplete="off"
        >

        <button class="paste" onclick="pasteURL()">
          📋 Paste
        </button>
      </div>

      <button class="download" id="searchBtn" onclick="getVideo()">
        🔍 Get Video
      </button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Getting video information...</p>
      </div>

      <div class="message" id="message"></div>

      <div class="result" id="result">

        <img
          id="thumbnail"
          class="thumb"
          src=""
          alt="Video thumbnail"
        >

        <div class="title" id="videoTitle">
          TikTok Video
        </div>

        <div class="author" id="author"></div>

        <select id="quality" class="quality">
          <option value="video">Video</option>
          <option value="audio">Audio</option>
        </select>

        <button
          class="download"
          id="downloadBtn"
          onclick="downloadVideo()"
        >
          ⬇️ Download
        </button>

      </div>

    </div>

    <div class="footer">
      Made with ❤️ • Use only content you have permission to download.
    </div>

  </main>

<script>
  /*
    IMPORTANT:
    এখানে আপনার Render service URL দিন।

    Example:
    const API_BASE = "https://your-service.onrender.com";
  */

  const API_BASE = "https://tiktok-video-downloader-6suv.onrender.com";

  let currentURL = "";
  let currentData = null;


  // Paste button
  async function pasteURL() {
    try {
      const text = await navigator.clipboard.readText();

      if (text) {
        document.getElementById("url").value = text;
      }
    } catch (error) {
      showMessage("Clipboard permission পাওয়া যায়নি। নিজে URL paste করুন।");
    }
  }


  // Show error
  function showMessage(text) {
    const box = document.getElementById("message");

    box.textContent = text;
    box.style.display = "block";
  }


  // Hide error
  function hideMessage() {
    document.getElementById("message").style.display = "none";
  }


  // Loading
  function setLoading(status) {
    document.getElementById("loading").style.display =
      status ? "block" : "none";

    document.getElementById("searchBtn").disabled = status;
  }


  // Get video information
  async function getVideo() {

    hideMessage();

    const url = document.getElementById("url").value.trim();

    if (!url) {
      showMessage("Please enter a TikTok URL.");
      return;
    }

    if (!/tiktok\.com/i.test(url)) {
      showMessage("Please enter a valid TikTok URL.");
      return;
    }

    currentURL = url;

    setLoading(true);

    document.getElementById("result").style.display = "none";

    try {

      const response = await fetch(
        API_BASE + "/api/info?url=" + encodeURIComponent(url)
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Unable to get video.");
      }

      currentData = data;

      document.getElementById("videoTitle").textContent =
        data.title || "TikTok Video";

      document.getElementById("author").textContent =
        data.author ? "@" + data.author : "";

      if (data.thumbnail) {
        document.getElementById("thumbnail").src = data.thumbnail;
        document.getElementById("thumbnail").style.display = "block";
      } else {
        document.getElementById("thumbnail").style.display = "none";
      }

      document.getElementById("result").style.display = "block";

    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Something went wrong. Please try again."
      );

    } finally {

      setLoading(false);
    }
  }


  // Download
  async function downloadVideo() {

    if (!currentURL) {
      showMessage("First enter a TikTok URL.");
      return;
    }

    const button = document.getElementById("downloadBtn");

    button.disabled = true;
    button.textContent = "⏳ Preparing...";

    hideMessage();

    try {

      const quality =
        document.getElementById("quality").value;

      const downloadURL =
        API_BASE +
        "/api/download?url=" +
        encodeURIComponent(currentURL) +
        "&type=" +
        encodeURIComponent(quality);

      /*
        Open the backend download endpoint.
        Browser will handle the file download/response.
      */

      window.location.href = downloadURL;

    } catch (error) {

      showMessage(
        error.message || "Download failed."
      );

    } finally {

      setTimeout(() => {
        button.disabled = false;
        button.textContent = "⬇️ Download";
      }, 2000);

    }
  }


  // Enter key
  document.getElementById("url").addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        getVideo();
      }

    }
  );


  // Check backend
  fetch(API_BASE + "/api/health")
    .then(response => response.json())
    .then(data => {
      console.log("Backend:", data);
    })
    .catch(error => {
      console.log("Backend health check failed:", error);
    });

</script>

</body>
  </html>
