<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>TikTok Downloader</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#35152b,transparent 35%),
    radial-gradient(circle at bottom right,#102b3d,transparent 35%),
    #08090d;
  color:white;
  padding:25px 15px;
}

.container{
  max-width:600px;
  margin:auto;
}

.header{
  text-align:center;
  margin:30px 0;
}

.header h1{
  font-size:32px;
  background:linear-gradient(90deg,#ff0050,#00f2ea);
  -webkit-background-clip:text;
  color:transparent;
}

.header p{
  color:#999;
  margin-top:8px;
}

.card{
  background:#15161c;
  border:1px solid #30313b;
  border-radius:20px;
  padding:22px;
}

label{
  display:block;
  color:#bbb;
  margin-bottom:8px;
  font-size:14px;
}

.input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #383944;
  background:#0c0d12;
  color:white;
  outline:none;
  font-size:15px;
}

.input:focus{
  border-color:#00f2ea;
}

select{
  width:100%;
  padding:14px;
  margin-top:15px;
  border-radius:12px;
  background:#0c0d12;
  border:1px solid #383944;
  color:white;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(90deg,#ff0050,#00b8ff);
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.status{
  text-align:center;
  margin-top:15px;
  color:#aaa;
}

.loading{
  display:none;
  text-align:center;
  margin-top:20px;
  color:#aaa;
}

.result{
  display:none;
  margin-top:20px;
  border-top:1px solid #333;
  padding-top:20px;
}

.thumbnail{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:15px;
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
}

.author{
  color:#999;
  margin-top:6px;
}

.error{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#32151c;
  color:#ff8ca5;
}

.footer{
  text-align:center;
  color:#666;
  font-size:12px;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎵 TikTok Downloader</h1>
    <p>Download your supported TikTok videos</p>
  </div>

  <div class="card">

    <label>TikTok Video URL</label>

    <input
      id="url"
      class="input"
      type="url"
      placeholder="https://www.tiktok.com/..."
    >

    <select id="quality">
      <option value="ultra">Ultra HD</option>
      <option value="1080" selected>1080p</option>
      <option value="780">780p</option>
      <option value="hd">HD / 720p</option>
    </select>

    <button id="getBtn" onclick="getVideo()">
      🔍 Get Video
    </button>

    <div class="loading" id="loading">
      ⏳ Please wait...
    </div>

    <div class="status" id="status"></div>

    <div class="error" id="error"></div>

    <div class="result" id="result">

      <img
        id="thumbnail"
        class="thumbnail"
        src=""
        alt="Thumbnail"
      >

      <div id="title" class="title">
        TikTok Video
      </div>

      <div id="author" class="author"></div>

      <button id="downloadBtn" onclick="downloadVideo()">
        ⬇️ Download
      </button>

    </div>

  </div>

  <div class="footer">
    Use only content you have permission to download.
  </div>

</div>

<script>

/*
  IMPORTANT:
  Same Render server ব্যবহার করছি।
  তাই আলাদা API URL লাগবে না।
*/

const API_BASE = window.location.origin;

let currentURL = "";


/* SHOW ERROR */

function showError(message){

  const error = document.getElementById("error");

  error.textContent = "❌ " + message;

  error.style.display = "block";
}


/* HIDE ERROR */

function hideError(){

  document.getElementById("error").style.display = "none";

}


/* LOADING */

function loading(state){

  document.getElementById("loading").style.display =
    state ? "block" : "none";

  document.getElementById("getBtn").disabled = state;

}


/* GET VIDEO */

async function getVideo(){

  hideError();

  const url =
    document.getElementById("url").value.trim();

  if(!url){

    showError("TikTok URL দিন।");

    return;
  }

  if(!/tiktok\.com/i.test(url)){

    showError("Valid TikTok URL দিন।");

    return;
  }

  currentURL = url;

  document.getElementById("result").style.display = "none";

  loading(true);

  document.getElementById("status").textContent =
    "Video information নেওয়া হচ্ছে...";

  try{

    const response = await fetch(
      API_BASE +
      "/api/info?url=" +
      encodeURIComponent(url)
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Video information পাওয়া যায়নি।"
      );
    }

    document.getElementById("title").textContent =
      data.title || "TikTok Video";

    document.getElementById("author").textContent =
      data.uploader
      ? "@" + data.uploader
      : "";

    const thumbnail =
      document.getElementById("thumbnail");

    if(data.thumbnail){

      thumbnail.src = data.thumbnail;
      thumbnail.style.display = "block";

    }else{

      thumbnail.style.display = "none";

    }

    document.getElementById("result").style.display =
      "block";

    document.getElementById("status").textContent =
      "✅ Video ready.";

  }catch(error){

    console.error(error);

    showError(error.message);

    document.getElementById("status").textContent = "";

  }finally{

    loading(false);

  }

}


/* DOWNLOAD */

async function downloadVideo(){

  if(!currentURL){

    showError("আগে একটি TikTok URL দিন।");

    return;
  }

  hideError();

  const button =
    document.getElementById("downloadBtn");

  const quality =
    document.getElementById("quality").value;

  button.disabled = true;

  button.textContent =
    "⏳ Preparing...";

  try{

    const response =
      await fetch(API_BASE + "/api/download",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          url:currentURL,

          quality:quality

        })

      });

    const data =
      await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Download failed."
      );
    }

    /*
      Open direct media URL
    */

    const a =
      document.createElement("a");

    a.href =
      data.download_url;

    a.target="_blank";

    a.rel="noopener";

    a.click();

    document.getElementById("status").textContent =
      "✅ Download link ready.";

  }catch(error){

    console.error(error);

    showError(error.message);

  }finally{

    button.disabled = false;

    button.textContent =
      "⬇️ Download";

  }

}


/* ENTER KEY */

document.getElementById("url")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){

    getVideo();

  }

});

</script>

</body>
</html>
